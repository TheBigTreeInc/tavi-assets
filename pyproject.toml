[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tavi-assets"
version = "0.1.4"
requires-python = ">=3.10"
[project.scripts]
tavi-assets = "tavi_assets.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tavi_assets = ["web/*.html", "web/*.css", "web/*.js"]
